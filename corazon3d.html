<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #2a1a4e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        .scene {
            position: relative;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            animation: rotate3d 8s linear infinite;
        }

        @keyframes rotate3d {
            0% { transform: rotateX(-15deg) rotateY(0deg); }
            100% { transform: rotateX(-15deg) rotateY(360deg); }
        }

        .heart-3d {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .heart-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .heart-layer svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(233, 69, 96, 0.8));
        }

        .heart-path {
            fill: url(#heartGradient3D);
            stroke: #ff6b6b;
            stroke-width: 1.5;
        }

        /* Capas del corazón 3D */
        .layer-1 { transform: translateZ(0px); }
        .layer-2 { transform: translateZ(10px); opacity: 0.9; }
        .layer-3 { transform: translateZ(20px); opacity: 0.8; }
        .layer-4 { transform: translateZ(30px); opacity: 0.7; }
        .layer-5 { transform: translateZ(40px); opacity: 0.6; }
        .layer-6 { transform: translateZ(50px); opacity: 0.5; }
        .layer-7 { transform: translateZ(60px); opacity: 0.4; }
        .layer-8 { transform: translateZ(70px); opacity: 0.3; }
        .layer-9 { transform: translateZ(80px); opacity: 0.2; }
        .layer-10 { transform: translateZ(90px); opacity: 0.1; }

        /* Capas traseras */
        .layer-back-1 { transform: translateZ(-10px); opacity: 0.9; }
        .layer-back-2 { transform: translateZ(-20px); opacity: 0.8; }
        .layer-back-3 { transform: translateZ(-30px); opacity: 0.7; }
        .layer-back-4 { transform: translateZ(-40px); opacity: 0.6; }
        .layer-back-5 { transform: translateZ(-50px); opacity: 0.5; }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .message {
            color: #fff;
            font-size: 22px;
            text-align: center;
            text-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .counter {
            color: #ff6b6b;
            font-size: 18px;
            background: rgba(233, 69, 96, 0.15);
            padding: 12px 25px;
            border-radius: 25px;
            border: 1px solid rgba(233, 69, 96, 0.4);
            backdrop-filter: blur(10px);
        }

        .particles-3d {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .particle-3d {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #ff6b6b, #e94560);
            border-radius: 50%;
            opacity: 0;
            animation: particle3d 2s ease-out infinite;
            box-shadow: 0 0 10px #e94560;
        }

        @keyframes particle3d {
            0% {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate3d(var(--tx), var(--ty), var(--tz)) scale(0);
            }
        }

        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(233, 69, 96, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .sparkle-3d {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #ff6b6b;
            animation: sparkle3d 1.5s ease-in-out infinite;
        }

        @keyframes sparkle3d {
            0%, 100% { opacity: 0; transform: scale(0) translateZ(0); }
            50% { opacity: 1; transform: scale(1) translateZ(50px); }
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            font-size: 14px;
            border: 1px solid rgba(233, 69, 96, 0.5);
            border-radius: 20px;
            background: rgba(233, 69, 96, 0.1);
            color: #ff6b6b;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: rgba(233, 69, 96, 0.3);
            transform: scale(1.05);
        }

        .btn.active {
            background: rgba(233, 69, 96, 0.4);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glow"></div>
        <div class="scene" id="scene">
            <div class="heart-3d" id="heart3d" onclick="createParticles3D()">
                <!-- Capas frontales -->
                <div class="heart-layer layer-1">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="heartGradient3D" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#ff2d55"/>
                                <stop offset="30%" style="stop-color:#e94560"/>
                                <stop offset="60%" style="stop-color:#ff6b6b"/>
                                <stop offset="100%" style="stop-color:#ee5a24"/>
                            </linearGradient>
                        </defs>
                        <path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
                <div class="heart-layer layer-2">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-3">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-4">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-5">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-6">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-7">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-8">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-9">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-10">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <!-- Capas traseras -->
                <div class="heart-layer layer-back-1">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-back-2">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-back-3">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-back-4">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="heart-layer layer-back-5">
                    <svg viewBox="0 0 24 24"><path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
            </div>
            <div class="particles-3d" id="particles3d"></div>
        </div>
        <div class="message">❤️ ¡Haz clic en el corazón 3D! ❤️</div>
        <div class="counter">Clics: <span id="clickCount">0</span></div>
        <div class="controls">
            <button class="btn active" onclick="toggleRotation(this)">🔄 Rotación</button>
            <button class="btn active" onclick="toggleBeat(this)">💓 Latido</button>
            <button class="btn" onclick="toggleAutoParticles(this)">✨ Auto Partículas</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        let isRotating = true;
        let isBeating = true;
        let autoParticles = false;
        const particlesContainer = document.getElementById('particles3d');
        const clickCountDisplay = document.getElementById('clickCount');
        const scene = document.getElementById('scene');
        const heart3d = document.getElementById('heart3d');

        function createParticles3D() {
            clickCount++;
            clickCountDisplay.textContent = clickCount;

            // Crear partículas 3D
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle-3d';
                
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const distance = 100 + Math.random() * 100;
                
                const tx = Math.sin(phi) * Math.cos(theta) * distance;
                const ty = Math.sin(phi) * Math.sin(theta) * distance;
                const tz = Math.cos(phi) * distance;
                
                particle.style.left = '50%';
                particle.style.top = '50%';
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                particle.style.setProperty('--tz', `${tz}px`);
                particle.style.animationDelay = `${Math.random() * 0.5}s`;
                
                particlesContainer.appendChild(particle);
                
                setTimeout(() => particle.remove(), 2500);
            }

            // Efecto de escala
            heart3d.style.transform = 'scale(1.2)';
            setTimeout(() => {
                heart3d.style.transform = '';
            }, 200);

            // Crear destellos
            createSparkles3D();
        }

        function createSparkles3D() {
            const sceneEl = document.getElementById('scene');
            for (let i = 0; i < 8; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle-3d';
                sparkle.style.left = `${10 + Math.random() * 80}%`;
                sparkle.style.top = `${10 + Math.random() * 80}%`;
                sparkle.style.animationDelay = `${Math.random() * 0.5}s`;
                sceneEl.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 2000);
            }
        }

        function toggleRotation(btn) {
            isRotating = !isRotating;
            btn.classList.toggle('active');
            if (isRotating) {
                scene.style.animation = 'rotate3d 8s linear infinite';
            } else {
                scene.style.animation = 'none';
                scene.style.transform = 'rotateX(-15deg) rotateY(0deg)';
            }
        }

        function toggleBeat(btn) {
            isBeating = !isBeating;
            btn.classList.toggle('active');
            const layers = document.querySelectorAll('.heart-layer');
            layers.forEach(layer => {
                if (isBeating) {
                    layer.style.animation = 'heartbeat3d 1.2s ease-in-out infinite';
                } else {
                    layer.style.animation = 'none';
                }
            });
        }

        function toggleAutoParticles(btn) {
            autoParticles = !autoParticles;
            btn.classList.toggle('active');
            if (autoParticles) {
                setInterval(() => {
                    if (autoParticles) createParticles3D();
                }, 2000);
            }
        }

        // Animación de latido para las capas
        const style = document.createElement('style');
        style.textContent = `
            @keyframes heartbeat3d {
                0%, 100% { transform: translateZ(var(--z)) scale(1); }
                14% { transform: translateZ(var(--z)) scale(1.1); }
                28% { transform: translateZ(var(--z)) scale(1); }
                42% { transform: translateZ(var(--z)) scale(1.1); }
                70% { transform: translateZ(var(--z)) scale(1); }
            }
            .heart-layer {
                animation: heartbeat3d 1.2s ease-in-out infinite;
            }
            .layer-1 { --z: 0px; }
            .layer-2 { --z: 10px; animation-delay: 0.05s; }
            .layer-3 { --z: 20px; animation-delay: 0.1s; }
            .layer-4 { --z: 30px; animation-delay: 0.15s; }
            .layer-5 { --z: 40px; animation-delay: 0.2s; }
            .layer-6 { --z: 50px; animation-delay: 0.25s; }
            .layer-7 { --z: 60px; animation-delay: 0.3s; }
            .layer-8 { --z: 70px; animation-delay: 0.35s; }
            .layer-9 { --z: 80px; animation-delay: 0.4s; }
            .layer-10 { --z: 90px; animation-delay: 0.45s; }
            .layer-back-1 { --z: -10px; animation-delay: 0.05s; }
            .layer-back-2 { --z: -20px; animation-delay: 0.1s; }
            .layer-back-3 { --z: -30px; animation-delay: 0.15s; }
            .layer-back-4 { --z: -40px; animation-delay: 0.2s; }
            .layer-back-5 { --z: -50px; animation-delay: 0.25s; }
        `;
        document.head.appendChild(style);

        // Soporte de teclado
        document.addEventListener('keydown', (event) => {
            if (event.key === ' ' || event.key === 'Enter') {
                event.preventDefault();
                createParticles3D();
            }
        });

        // Partículas automáticas iniciales
        setTimeout(() => {
            createParticles3D();
        }, 1000);
    </script>
</body>
</html>
